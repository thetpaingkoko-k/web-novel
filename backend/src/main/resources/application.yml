spring:
  application:
    name: webnovel-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  docker:
    compose:
      enabled: false            # Postgres is run externally (podman/managed); no Docker daemon assumed
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema — Hibernate never mutates it
    open-in-view: false         # DTOs are assembled in services, not via lazy loading in controllers
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}          # Render (and other PaaS) inject the listen port via $PORT

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-insecure-secret-change-me-min-32-bytes!!}
    access-ttl: ${APP_JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${APP_JWT_REFRESH_TTL:P30D}
  platform-fee-percent: ${APP_PLATFORM_FEE_PERCENT:20}
  min-withdrawal-mmk: ${APP_MIN_WITHDRAWAL_MMK:5000}
  base-subscription-price-mmk: ${APP_BASE_SUBSCRIPTION_PRICE_MMK:5000}   # system baseline; not author-set, admin-adjustable
  subscription-days: ${APP_SUBSCRIPTION_DAYS:30}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  uploads:
    dir: ${APP_UPLOADS_DIR:images}
  storage:
    # `local` = filesystem served at /uploads/** (dev). `supabase` = Supabase Storage
    # (prod; survives ephemeral-host restarts). Supabase fields required when type=supabase.
    type: ${APP_STORAGE_TYPE:local}
    supabase:
      url: ${SUPABASE_URL:}
      bucket: ${SUPABASE_BUCKET:uploads}
      service-key: ${SUPABASE_SERVICE_KEY:}
