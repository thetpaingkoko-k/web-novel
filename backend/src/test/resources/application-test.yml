# Integration-test profile. The datasource is provided by the Testcontainers
# Postgres via @ServiceConnection; Flyway + ddl-auto:validate come from the
# shared application.yml. JWT secret is fixed so tokens are deterministic.
app:
  jwt:
    secret: test-only-secret-value-at-least-32-bytes-long!!
logging:
  level:
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
